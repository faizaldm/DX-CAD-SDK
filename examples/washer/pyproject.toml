[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dxcad-washer"
version = "0.1.0"
description = "A DX-CAD SDK example: washer() in every model.py"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.entry-points."dxcad.plugins"]
washer = "dxcad_washer:register"

[tool.setuptools]
py-modules = ["dxcad_washer"]
